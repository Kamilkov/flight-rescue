<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight rescue · your trip</title>
  <style>
    :root { color-scheme: light dark; --accent: #0a6ed1; --error: #bb0000; --ok: #107e3e; --warn: #e9730c; --muted: #6a6d70; }
    @media (prefers-color-scheme: dark) { :root { --error: #ff6b6b; } } /* the light red is 2.8:1 on the dark page, this one 6.8:1 */
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: Canvas; color: CanvasText; }
    main { max-width: 28rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    #card { padding: 1rem; border-radius: .75rem; border-left: 5px solid var(--muted); background: color-mix(in srgb, CanvasText 5%, Canvas); }
    #card[data-kind="offer"] { border-color: var(--warn); }
    #card[data-kind="done"] { border-color: var(--ok); }
    #card[data-kind="error"] { border-color: var(--error); }
    h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
    p { margin: 0; }
    button { width: 100%; margin-top: 1rem; padding: .9rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: .6rem; }
    button:disabled { opacity: .55; }
    #error { margin-top: 1rem; color: var(--error); }
    footer { margin-top: 1.5rem; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Your trip</h1>
    <section id="card" data-kind="none" aria-live="polite">
      <h2 id="title">Loading…</h2>
      <p id="text"></p>
      <button id="accept" type="button" hidden>Accept</button>
    </section>
    <p id="error" role="alert" hidden></p>
    <footer>Demo: this page stands for the airline's app, signed in as one passenger.</footer>
  </main>

  <!-- The page's logic is a UI5-style module; this page runs its factory without UI5, as the tests do. -->
  <script>window.sap = { ui: { define: (deps, factory) => { window.offer = factory() } } }</script>
  <script src="offer.js"></script>
  <script>
    // Polls the passenger's offer every 2 s; Accept asks the booking system to move the booking.
    async function passenger(path, body) {
      const res = await fetch(`/odata/v4/passenger/${path}`, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      const data = await res.json().catch(() => null)
      if (!res.ok) throw new Error(data?.error?.message ?? `The server answered ${res.status}.`)
      return data
    }
    const $ = id => document.getElementById(id)
    // The card is a live region and is polled every 2 s, so it is redrawn only when it changed: a redraw is read out again
    // by a screen reader, and would clear an error about the card (a refused Accept) before anyone could read it.
    // A failed poll forces the next redraw, which clears that poll's error.
    let shown = ''
    function show(o) {
      const v = offer.offerView(o), key = JSON.stringify(v)
      if (key === shown) return
      shown = key
      problem(null)
      $('card').dataset.kind = v.kind
      $('title').textContent = v.title
      $('text').textContent = v.text
      $('accept').hidden = !v.action
    }
    function problem(e) {
      const text = e ? e.message : ''
      $('error').hidden = !e
      if ($('error').textContent !== text) $('error').textContent = text // the same problem is not read out again
    }
    async function load() { try { show(await passenger('myOffer()')) } catch (e) { shown = ''; problem(e) } }
    $('accept').addEventListener('click', async () => {
      $('accept').disabled = true
      try { show(await passenger('acceptOffer', {})); problem(null) } catch (e) { problem(e) } finally { $('accept').disabled = false }
    })
    load()
    setInterval(load, 2000)
  </script>
</body>
</html>
